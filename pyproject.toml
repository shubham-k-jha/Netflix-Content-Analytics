[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netflix-content-intelligence"
version = "8.1.0"
description = "Reproducible Netflix Top 10 analytics, geographic intelligence, lifecycle analysis and forecasting"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1,<3", "numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-learn>=1.4,<2",
  "plotly>=5.18,<7", "streamlit>=1.30,<2", "shap>=0.45,<1"
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
